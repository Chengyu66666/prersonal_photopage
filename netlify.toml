[build]
  publish = "."

# The originals under assets/opt/ are large and never edited in place -- a photo
# is re-exported under a new name, not overwritten -- so they can be cached hard.
# QR / SVG assets keep default caching: those filenames stay put across edits, so
# a year-long cache would pin a stale file.
[[headers]]
  for = "/assets/opt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The homepage collage derivatives are named set<N>-<M>.webp and regenerated in
# place, so the *name* is stable across edits. But they only change when the
# manifest changes, which is a deliberate act -- and re-deploying pushes new
# bytes under the same name. Keep this short so a regrouped set is picked up
# without asking visitors to hard-refresh.
[[headers]]
  for = "/assets/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
