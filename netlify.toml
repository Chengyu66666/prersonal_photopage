[build]
  publish = "."

# Web derivatives are regenerated by name, never edited in place, so they can be
# cached hard. The camera masters under assets/photos are immutable too.
[[headers]]
  for = "/assets/opt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
